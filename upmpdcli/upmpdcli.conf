# upmpdcli: UPnP/OpenHome renderer in front of MPD, plus the Qobuz browser.
# Installed to /etc/upmpdcli.conf by deploy/install_upmpdcli.sh.
# No credentials here: Qobuz login is done once through OAuth
# (qobuz-init-oauth.py) and the token is kept in upmpdcli's own cache.

friendlyname = BPi-M2U-Streamer
openhome = 1

# Bind UPnP to the LAN interface only, not to wg0. Use end0 when on Ethernet.
upnpiface = wlan0

mpdhost = localhost
mpdport = 6600

# Qobuz stream quality: 5 = MP3 320, 6 = FLAC 16 bit/44.1 kHz, 7 = 24/96,
# 27 = 24/192. The USB DAC is 16 bit/44.1-48 kHz, so 6 avoids pointless
# downloads and resampling on the A7.
# Enable the Qobuz entry. The user name is a placeholder: login is by OAuth token.
qobuzautostart = 1
qobuzuser = oauth
qobuztitle = Qobuz
qobuzformatid = 6
