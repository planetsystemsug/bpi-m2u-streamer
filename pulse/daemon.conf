# Streamer box PulseAudio (system mode). Only Soloist uses it; the sink is a
# fixed 44.1 kHz S16 dmix, and Spotify streams are 44.1 kHz, so normally no
# resampling happens at all. If a client does need it, use the best resampler.
default-sample-format = s16le
default-sample-rate = 44100
alternate-sample-rate = 48000
resample-method = soxr-vhq
flat-volumes = no
